<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-iURMwAzz8s+fbLvBE5TLrfJ5MayqiDBe+i5n2hlfncU='; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Project being rebuilt</title>
<style>
:root { --bg: #f4f2ee; --fg: #1c1b19; --muted: #6b6760; --rule: #d6d2ca; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --fg: #ecebe7; --muted: #9a968e; --rule: #34332f; }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: grid; place-items: center; padding: 24px 16px;
}
main { width: 100%; max-width: 40rem; text-align: center; }
.mark { width: 40px; height: 40px; margin: 0 auto 32px; border: 3px solid var(--fg); border-radius: 50%; position: relative; }
.mark::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--fg); }
h1 {
  font-size: clamp(1.9rem, 7vw, 3.4rem); font-weight: 800;
  letter-spacing: 0.06em; line-height: 1.1; text-wrap: balance;
}
hr { width: 64px; border: 0; border-top: 2px solid var(--rule); margin: 28px auto; }
p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
#d { color: var(--fg); font-weight: 600; overflow-wrap: anywhere; }
#d:empty { display: none; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>
  <h1>PROJECT BEING REBUILT</h1>
  <hr>
  <p><span id="d"></span></p>
  <p>This site is offline while the project is rebuilt.</p>
</main>
<script>document.getElementById("d").textContent=location.hostname.replace(/^www\./,"");</script>
</body>
</html>
